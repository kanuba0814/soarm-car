# Nav2 simulation configuration for the native Fortress Ackermann chassis.
# map -> odom_combined and /odom are published by soarm_simulation; AMCL is intentionally absent.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_nav_to_pose_bt_xml: navigate_ackermann.xml
    default_nav_through_poses_bt_xml: navigate_through_poses_ackermann.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 0.8
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      lookup_table_size: 8.0
      cache_obstacle_heuristic: true
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      # Ackermann cannot rotate in place; accept the arrival tangent while enforcing XY precision.
      yaw_goal_tolerance: 1.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.28
      min_approach_linear_velocity: 0.08
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_rotate_to_heading: false
      allow_reversing: true
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.08
      inflation_cost_scaling_factor: 4.0
      max_allowed_time_to_collision_up_to_carrot: 1.5

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    behavior_plugins: [backup, drive_on_heading, wait]
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.4, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.2
      resolution: 0.05
      robot_radius: 0.24
      track_unknown_space: true
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 4.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom_combined
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      robot_radius: 0.24
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: mid360
        mid360:
          topic: /mid360/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 3.2
          raytrace_max_range: 3.8
          # Initial scan measurements show self returns through 0.30 m; 0.35 m
          # clears the 0.274 m third-deck envelope and nearby parked arm geometry.
          obstacle_min_range: 0.35
          raytrace_min_range: 0.0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.5
          expected_update_rate: 0.2
          observation_persistence: 0.5
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 4.0
