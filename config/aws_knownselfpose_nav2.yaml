# Research-only Nav2 parameters. The map is generated at runtime from the
# recorded LiDAR survey; unknown map cells remain unknown and are not traversable.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /known_self_pose/odom
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_follow_path_action_bt_node, nav2_pipeline_sequence_bt_node]
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_smac_planner/SmacPlanner2D, tolerance: 0.0, allow_unknown: false, max_iterations: 100000}
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: /known_self_pose/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: nav2_controller::SimpleProgressChecker, required_movement_radius: 0.08, movement_time_allowance: 15.0}
    goal_checker: {plugin: nav2_controller::SimpleGoalChecker, xy_goal_tolerance: 0.18, yaw_goal_tolerance: 0.20, stateful: false}
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.15
      max_vel_x: 0.15
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.5
      max_speed_xy: 0.15
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.8
      vx_samples: 12
      vy_samples: 12
      vtheta_samples: 16
      sim_time: 1.2
      critics: [RotateToGoal, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.08
      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: [backup, drive_on_heading, wait]
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Native 0.60 m chassis plus 0.05 m margin on each side: 0.70 m square.
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      track_unknown_space: true
      plugins: [static_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.50, cost_scaling_factor: 3.0}
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar: {topic: /mid360/scan/points/points, data_type: PointCloud2, marking: true, clearing: true, obstacle_max_range: 3.5, raytrace_max_range: 4.0, min_obstacle_height: 0.10, max_obstacle_height: 1.5}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.50, cost_scaling_factor: 3.0}
