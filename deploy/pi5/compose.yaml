services:
  wheeltec-base:
    build:
      context: ../..
      dockerfile: deploy/pi5/Dockerfile
      additional_contexts:
        wheeltec_vendor: ../../vendor/wheeltec/src
        localization_vendor: ../../vendor/localization/src
    image: soarm-wheeltec-base:pi5
    platform: linux/arm64
    network_mode: host
    devices:
      - /dev/wheeltec_controller:/dev/wheeltec_controller
      - /dev/bus/usb:/dev/bus/usb
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
